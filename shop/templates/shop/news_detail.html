{% extends 'shop/base.html' %}

{% block content %}
<div class="container">
    <h2>{{ news.title }}</h2>
    <div class="news-detail">
        <p class="news-date">{{ news.published_at|date:"d.m.Y H:i" }}</p>
        <div class="news-content">
            {{ news.text|linebreaks }}
        </div>
    </div>
    <a href="{% url 'news_list' %}" class="back-button">← Назад к списку новостей</a>
</div>
{% endblock %}
